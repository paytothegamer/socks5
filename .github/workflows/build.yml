name: Build SOCKS5 VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: CHECKOUT CODE WITH SUBMODULES
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: SET UP JAVA JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: SET UP ANDROID SDK & NDK
        uses: android-actions/setup-android@v3

      - name: ACCEPT LICENSES & INSTALL BUILD TOOLS
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: PREPARE GRADLE ENVIRONMENT & PERMISSIONS
        run: |
          echo "Current working directory:"
          pwd
          ls -la

          # Locate gradlew across the repo or submodules
          GRADLEW_FILE=$(find . -name "gradlew" | head -n 1)

          if [ -n "$GRADLEW_FILE" ]; then
            echo "Found gradlew at: $GRADLEW_FILE"
            chmod +x "$GRADLEW_FILE"
            TARGET_DIR=$(dirname "$GRADLEW_FILE")
            echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV
          else
            echo "gradlew not found. Generating fresh Gradle wrapper..."
            sudo apt-get update -qq && sudo apt-get install -y -qq gradle
            gradle wrapper
            chmod +x gradlew
            echo "TARGET_DIR=." >> $GITHUB_ENV
          fi

      - name: COMPILE DEBUG APK
        run: |
          cd ${{ env.TARGET_DIR }}
          echo "Building in: $(pwd)"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: LOCATE AND STAGE BUILT APK
        run: |
          mkdir -p output_apk
          find . -type f -name "*.apk" -exec cp {} output_apk/ \;
          echo "Staged APKs:"
          ls -lh output_apk/

      - name: UPLOAD OUTPUT APK AS ARTIFACT
        uses: actions/upload-artifact@v4
        with:
          name: SOCKS5_VPN_Debug_APK
          path: output_apk/*.apk
          retention-days: 7
          
