name: Build SOCKS5 VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: CHECKOUT CODE WITH SUBMODULES
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: SET UP JAVA JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: ACCEPT ANDROID LICENSES
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: INJECT FAST GRADLE 6.9 WRAPPER
        run: |
          mkdir -p gradle/wrapper

          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v6.9.4/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar

          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-6.9.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v6.9.4/gradlew -o gradlew
          chmod +x gradlew

      - name: AUTO-PATCH REPOSITORIES & OBSOLETE GROOVY PLUGIN
        run: |
          echo "Patching Gradle build scripts..."
          python3 - << 'EOF'
          import os

          # 1. Patch root build.gradle
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith(".gradle"):
                      filepath = os.path.join(root, file)
                      with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()

                      # Ensure gradlePluginPortal() is present for legacy plugin resolution
                      patched = content
                      if "repositories {" in patched:
                          patched = patched.replace("repositories {", "repositories {\n        gradlePluginPortal()\n        google()\n        mavenCentral()")

                      # Neutralize obsolete groovy android plugin that breaks on modern networks
                      lines = []
                      for line in patched.splitlines():
                          if "gradle-groovy-android-plugin" in line or "groovyx.grooid.groovy-android" in line:
                              lines.append("// " + line)
                          else:
                              lines.append(line)
                      patched = "\n".join(lines)

                      if patched != content:
                          with open(filepath, "w", encoding="utf-8") as f:
                              f.write(patched)
                          print(f"Patched: {filepath}")

          print("All build scripts successfully configured.")
          EOF

      - name: COMPILE DEBUG APK (BYPASS UNUSED TESTS)
        run: |
          echo "Compiling APK..."
          ./gradlew assembleDebug -x test --no-daemon --stacktrace

      - name: LOCATE AND STAGE BUILT APK
        run: |
          mkdir -p output_apk
          find . -type f -name "*.apk" -exec cp {} output_apk/ \;
          echo "Generated APK files:"
          ls -lh output_apk/

      - name: UPLOAD OUTPUT APK AS ARTIFACT
        uses: actions/upload-artifact@v4
        with:
          name: SOCKS5_VPN_Debug_APK
          path: output_apk/*.apk
          retention-days: 7
          
