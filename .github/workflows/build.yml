name: Build SOCKS5 VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: CHECKOUT CODE WITH SUBMODULES
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: SET UP JAVA JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: ACCEPT ANDROID LICENSES
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: INJECT FAST GRADLE 6.9 WRAPPER
        run: |
          mkdir -p gradle/wrapper

          # Download official gradle-wrapper.jar
          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v6.9.4/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar

          # Create wrapper properties pointing to Gradle 6.9.4
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-6.9.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # Download official gradlew script
          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v6.9.4/gradlew -o gradlew
          chmod +x gradlew
          ls -la gradlew gradle/wrapper/

      - name: AUTO-PATCH DEAD REPOSITORIES SAFELY
        run: |
          echo "Patching build files with Python to prevent bash quoting errors..."
          python3 - << 'EOF'
          import os

          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith(".gradle"):
                      filepath = os.path.join(root, file)
                      with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()

                      # Replace dead jcenter() with mavenCentral()
                      patched = content.replace("jcenter()", "mavenCentral()")

                      if patched != content:
                          with open(filepath, "w", encoding="utf-8") as f:
                              f.write(patched)
                          print(f"Patched repositories in: {filepath}")

          print("Build scripts successfully patched.")
          EOF

      - name: COMPILE DEBUG APK
        run: |
          echo "Compiling APK with Gradle 6.9..."
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: LOCATE AND STAGE BUILT APK
        run: |
          mkdir -p output_apk
          find . -type f -name "*.apk" -exec cp {} output_apk/ \;
          echo "Staged APK files:"
          ls -lh output_apk/

      - name: UPLOAD OUTPUT APK AS ARTIFACT
        uses: actions/upload-artifact@v4
        with:
          name: SOCKS5_VPN_Debug_APK
          path: output_apk/*.apk
          retention-days: 7
          
