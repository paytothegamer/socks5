name: Build SOCKS5 VPN APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: CLONE MODERN UPDATED SOCKSDROID ENGINE
        run: |
          # Pull modern, maintained SocksDroid source (supports Android 8 - 14+)
          git clone --recurse-submodules https://github.com/bndeff/socksdroid.git app_source
          cd app_source
          ls -la

      - name: SET UP JAVA JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: ACCEPT ANDROID LICENSES & SETUP NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-31" "build-tools;31.0.3"

      - name: COMPILE PRODUCTION DEBUG APK
        run: |
          cd app_source
          chmod +x gradlew
          echo "Building SocksDroid VPN APK..."
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: STAGE GENERATED APK
        run: |
          mkdir -p output_apk
          find app_source/ -type f -name "*.apk" -exec cp {} output_apk/ \;
          echo "Built APK files:"
          ls -lh output_apk/

      - name: UPLOAD APK ARTIFACT
        uses: actions/upload-artifact@v4
        with:
          name: SocksDroid_SOCKS5_VPN_APK
          path: output_apk/*.apk
          retention-days: 14
          
