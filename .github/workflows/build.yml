name: Build SOCKS5 VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: CHECKOUT CODE WITH SUBMODULES
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: SET UP JAVA JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ACCEPT LICENSES ON PRE-INSTALLED ANDROID SDK
        run: |
          # Use pre-installed Android SDK on GitHub runner
          echo "ANDROID_HOME: $ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: PREPARE GRADLE ENVIRONMENT & PERMISSIONS
        run: |
          pwd
          ls -la

          # Find gradlew in repo root or subfolders
          GRADLEW_FILE=$(find . -name "gradlew" | head -n 1)

          if [ -n "$GRADLEW_FILE" ]; then
            echo "Found gradlew at: $GRADLEW_FILE"
            chmod +x "$GRADLEW_FILE"
            TARGET_DIR=$(dirname "$GRADLEW_FILE")
            echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV
          else
            echo "Generating fresh Gradle wrapper..."
            sudo apt-get update -qq && sudo apt-get install -y -qq gradle
            gradle wrapper
            chmod +x gradlew
            echo "TARGET_DIR=." >> $GITHUB_ENV
          fi

      - name: COMPILE DEBUG APK
        run: |
          cd ${{ env.TARGET_DIR }}
          echo "Building in: $(pwd)"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: LOCATE AND STAGE BUILT APK
        run: |
          mkdir -p output_apk
          find . -type f -name "*.apk" -exec cp {} output_apk/ \;
          echo "Generated APKs:"
          ls -lh output_apk/

      - name: UPLOAD OUTPUT APK AS ARTIFACT
        uses: actions/upload-artifact@v4
        with:
          name: SOCKS5_VPN_Debug_APK
          path: output_apk/*.apk
          retention-days: 7
          
