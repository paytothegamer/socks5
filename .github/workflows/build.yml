name: Build SOCKS5 VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: CHECKOUT CODE WITH SUBMODULES
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: SET UP JAVA JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: ACCEPT ANDROID SDK LICENSES
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: INJECT FAST GRADLE 6.9 WRAPPER
        run: |
          mkdir -p gradle/wrapper

          # Use Gradle 6.9 wrapper binaries (ideal compatibility with older AGP)
          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v6.9.4/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar

          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-6.9.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v6.9.4/gradlew -o gradlew
          chmod +x gradlew

      - name: AUTO-PATCH DEAD JCENTER & OBSOLETE GROOVY PLUGINS
        run: |
          echo "Patching dead repos and removed plugins across build.gradle files..."

          # Replace defunct jcenter with mavenCentral and google
          find . -maxdepth 2 -name "build.gradle" -exec sed -i 's/jcenter()/google()\n        mavenCentral()\n        gradlePluginPortal()/g' {} +

          # Remove the dead org.codehaus.groovy plugin classpath
          find . -maxdepth 2 -name "build.gradle" -exec sed -i '/gradle-groovy-android-plugin/d' {} +

          # Remove apply plugin: 'groovyx.grooid.groovy-android' if present
          find . -maxdepth 2 -name "
          
