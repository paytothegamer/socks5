name: Build SOCKS5 VPN APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Android NDK & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529" "ndk;25.2.9519653"

      - name: Locate and Prepare Gradle Wrapper
        run: |
          # If gradlew is in a subdirectory, bring it up or find it
          if [ ! -f "./gradlew" ]; then
            FIND_GRADLEW=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
            if [ -n "$FIND_GRADLEW" ]; then
              echo "Found gradlew in $FIND_GRADLEW, copying to root..."
              cp "$FIND_GRADLEW" ./gradlew
            else
              echo "Installing gradle to generate wrapper..."
              sudo apt-get update && sudo apt-get install -y gradle
              gradle wrapper || true
            fi
          fi
          chmod +x ./gradlew || true

      - name: Build Debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/21.4.7075529
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/21.4.7075529
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace || ./gradlew assembleDebug -Dorg.gradle.java.home=$JAVA_HOME_11_X64

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: Socks5-Proxy-VPN-APK
          path: "**/build/outputs/apk/**/*.apk"
          
