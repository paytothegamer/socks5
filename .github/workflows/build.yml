name: Build SOCKS5 VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: CHECKOUT CODE WITH SUBMODULES
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: SET UP JAVA JDK 11 (COMPATIBLE WITH SOCKSDROID AGP)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: ACCEPT ANDROID LICENSES
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: INJECT FAST GRADLE WRAPPER (UNDER 3 SECONDS)
        run: |
          mkdir -p gradle/wrapper

          # Download official gradle-wrapper.jar directly (bypasses slow apt-get install)
          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v7.4.2/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar

          # Create gradle-wrapper.properties configured with Gradle 7.4.2
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-7.4.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # Create official POSIX gradlew bootstrap script
          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v7.4.2/gradlew -o gradlew
          chmod +x gradlew
          ls -la gradlew gradle/wrapper/

      - name: COMPILE DEBUG APK
        run: |
          echo "Starting compilation with Gradle 7.4.2..."
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: LOCATE AND STAGE BUILT APK
        run: |
          mkdir -p output_apk
          find . -type f -name "*.apk" -exec cp {} output_apk/ \;
          echo "Staged APKs:"
          ls -lh output_apk/

      - name: UPLOAD OUTPUT APK AS ARTIFACT
        uses: actions/upload-artifact@v4
        with:
          name: SOCKS5_VPN_Debug_APK
          path: output_apk/*.apk
          retention-days: 7
          
